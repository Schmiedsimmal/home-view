# =============================================================================
# Home Monitoring - docker-compose
#
# One service: home-monitoring (FastAPI web UI + camera pipeline).
#
# IMPORTANT: On the Jetson the NVIDIA Container Runtime must be installed
# (see scripts/setup-jetson.sh). On x86 dev machines use the file
# docker-compose.override.yml (no GPU, different video device).
#
# Network: network_mode=host because the Jetson has an IPv6-only internet
# connection (no IPv4 default route). Bridge networks inside the Docker
# container would otherwise have no working DNS/internet access
# (ntfy.sh, pip index).
# =============================================================================

services:
  home-monitoring:
    build:
      context: .
      dockerfile: Dockerfile
      # Build steps (pip install) also run over the host network so that
      # DNS/IPv6 resolves (see network_mode above).
      network: host
    container_name: home-monitoring
    restart: unless-stopped
    network_mode: host
    # Docker sets 8.8.8.8 as DNS for host-networked containers (IPv4), but
    # the Jetson only has IPv6 internet. The host's systemd-resolved stub
    # at 127.0.0.53 is reachable in the host network and resolves DNS
    # (important for ntfy.sh notifications).
    dns:
      - 127.0.0.53
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - PYTHONUNBUFFERED=1
    runtime: nvidia
    devices:
      # USB webcam (backend=usb): host device (e.g. /dev/video0) is mapped
      # as /dev/video0 into the container. Adjust VIDEO_DEVICE in .env.
      # IMPORTANT: Docker aborts startup if the host device does not exist —
      # when only using a CSI camera (no USB device) comment out this line!
      - ${VIDEO_DEVICE:-/dev/video0}:/dev/video0
      # CSI camera (backend=nvargus): Argus/ISP/GPU devices + Argus socket.
      # Without these mounts nvarguscamerasrc cannot open in the container.
      - /dev/nvhost-as-gpu:/dev/nvhost-as-gpu
      - /dev/nvhost-ctrl:/dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu:/dev/nvhost-ctrl-gpu
      - /dev/nvhost-ctrl-isp:/dev/nvhost-ctrl-isp
      - /dev/nvhost-ctrl-isp.1:/dev/nvhost-ctrl-isp.1
      - /dev/nvhost-ctrl-nvdec:/dev/nvhost-ctrl-nvdec
      - /dev/nvhost-ctrl-vi:/dev/nvhost-ctrl-vi
      - /dev/nvhost-ctxsw-gpu:/dev/nvhost-ctxsw-gpu
      - /dev/nvhost-dbg-gpu:/dev/nvhost-dbg-gpu
      - /dev/nvhost-gpu:/dev/nvhost-gpu
      - /dev/nvhost-isp:/dev/nvhost-isp
      - /dev/nvhost-isp.1:/dev/nvhost-isp.1
      - /dev/nvhost-msenc:/dev/nvhost-msenc
      - /dev/nvhost-nvdec:/dev/nvhost-nvdec
      - /dev/nvhost-nvjpg:/dev/nvhost-nvjpg
      - /dev/nvhost-prof-gpu:/dev/nvhost-prof-gpu
      - /dev/nvhost-sched-gpu:/dev/nvhost-sched-gpu
      - /dev/nvhost-tsec:/dev/nvhost-tsec
      - /dev/nvhost-tsecb:/dev/nvhost-tsecb
      - /dev/nvhost-tsg-gpu:/dev/nvhost-tsg-gpu
      - /dev/nvhost-vi:/dev/nvhost-vi
      - /dev/nvhost-vic:/dev/nvhost-vic
      - /dev/nvmap:/dev/nvmap
    volumes:
      # Argus daemon socket (host) -> container (for nvarguscamerasrc)
      - /tmp/argus_socket:/tmp/argus_socket
      # Recordings SSD (host path -> /recordings in the container)
      - ${RECORDINGS_HOST_DIR:-/mnt/ssd/recordings}:/recordings:rw
      # YOLO ONNX model (./models/yolov8n.onnx on the host)
      - ./models:/app/models:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Log rotation: the camera retry loop (camera not plugged in) would
    # otherwise generate very many logs. Keep at most 3 x 10 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
