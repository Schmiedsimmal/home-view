<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Monitoring - Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1115;
            color: #e6e6e6;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: #1a1d24;
            border-radius: 12px;
            padding: 32px;
            width: 320px;
            box-shadow: 0 4px 24px rgba(0,0,0,.4);
        }
        h1 { margin: 0 0 6px; font-size: 20px; }
        p.sub { margin: 0 0 24px; color: #8a8f98; font-size: 13px; }
        label { display: block; font-size: 13px; color: #8a8f98; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2a2f3a;
            background: #23272f;
            color: #e6e6e6;
            font-size: 15px;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .error { color: #ef5350; font-size: 13px; margin: -8px 0 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Wohnungs-Monitoring</h1>
        <p class="sub">Bitte anmelden, um fortzufahren.</p>
        {{ERROR}}
        <form method="post" action="/login">
            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" autofocus required>
            <button type="submit">Anmelden</button>
        </form>
    </div>
</body>
</html>
